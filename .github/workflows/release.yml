name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          bash -n ms2-sh
          gh release create "$TAG" ms2-sh \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ms2-sh $TAG" \
            --notes-file .github/release-notes/v0.1.0.md \
            --latest
